[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "localmind-runtime"
version = "0.5.0"
description = "Local event and context runtime with explicit provenance and correction barriers"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
localmind = "localmind.cli:main"

[tool.setuptools.packages.find]
include = ["localmind*"]
